<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 90" width="320" height="90" fill="none">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F6D39D"/>
      <stop offset="50%" stop-color="#E5A962"/>
      <stop offset="100%" stop-color="#C78538"/>
    </linearGradient>
    <linearGradient id="circleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#24262b"/>
      <stop offset="100%" stop-color="#111215"/>
    </linearGradient>
  </defs>
  <!-- Circular Badge -->
  <circle cx="45" cy="45" r="40" fill="url(#circleGrad)" stroke="url(#goldGrad)" stroke-width="2"/>
  <circle cx="45" cy="45" r="36" fill="none" stroke="rgba(229,169,98,0.3)" stroke-width="1" stroke-dasharray="3 3"/>
  
  <!-- Stylized Cutlery & Drink Glass Icon -->
  <g transform="translate(27, 20) scale(0.72)">
    <!-- Glass with Straw -->
    <path d="M12 8 L38 8 L34 36 Q25 46 16 36 Z" fill="rgba(229,169,98,0.18)" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linejoin="round"/>
    <!-- Liquid Wave -->
    <path d="M15 20 Q25 24 35 20" stroke="url(#goldGrad)" stroke-width="1.8" fill="none"/>
    <!-- Straw -->
    <line x1="32" y1="2" x2="25" y2="24" stroke="#F6D39D" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Stem & Base -->
    <line x1="25" y1="42" x2="25" y2="54" stroke="url(#goldGrad)" stroke-width="2.5"/>
    <line x1="14" y1="54" x2="36" y2="54" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Typography -->
  <text x="100" y="42" font-family="'Cinzel', 'Playfair Display', Georgia, serif" font-size="26" font-weight="800" letter-spacing="4.5" fill="#FFFFFF">PALATE</text>
  <text x="100" y="68" font-family="'Outfit', 'Inter', sans-serif" font-size="20" font-weight="700" letter-spacing="7" fill="url(#goldGrad)">STORY</text>
  <text x="101" y="82" font-family="'Outfit', sans-serif" font-size="7.5" font-weight="600" letter-spacing="2.8" fill="#A3AAB5">INDIAN • CHINESE • CONTINENTAL</text>
</svg>